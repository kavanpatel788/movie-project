<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Online Movie Ticket Booking</h1>
    </header>
    <main>
        <section id="movie-selection">
            <h2>Select a Movie</h2>
            <select id="movie-list">
                <option value="">Choose a movie</option>
                <option value="Avengers">Avengers: Endgame</option>
                <option value="Inception">Inception</option>
                <option value="Titanic">Titanic</option>
            </select>
        </section>
        
        <section id="showtime-selection" style="display: none;">
            <h2>Select Showtime</h2>
            <select id="showtime-list">
                <option value="">Choose a time</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="6:00 PM">6:00 PM</option>
            </select>
        </section>
        
        <section id="seat-selection" style="display: none;">
            <h2>Select Seats (Max 5)</h2>
            <div id="seats">
                <!-- Seats will be generated by JS -->
            </div>
            <p>Selected Seats: <span id="selected-seats"></span></p>
        </section>
        
        <section id="user-details" style="display: none;">
            <h2>Enter Your Details</h2>
            <form id="booking-form">
                <label>Name: <input type="text" id="name" required></label><br>
                <label>Email: <input type="email" id="email" required></label><br>
                <label>Phone: <input type="tel" id="phone" required></label><br>
                <button type="submit">Book Tickets</button>
            </form>
        </section>
        
        <section id="confirmation" style="display: none;">
            <h2>Booking Confirmed!</h2>
            <p id="booking-details"></p>
            <button id="reset-btn">Book Another</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
