<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookByShows</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#071427;
  color:#fff;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:24px;
  font-weight:600;
}

.logo span{
  color:#4da3ff;
}

nav ul{
  display:flex;
  list-style:none;
  gap:30px;
}

nav ul li{
  cursor:pointer;
  opacity:.8;
}

nav ul li:hover{
  opacity:1;
}

/* HERO */
.hero{
  height:80vh;
  background:url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?q=80&w=1600") center/cover no-repeat;
  display:flex;
  align-items:center;
  padding-left:80px;
}

.hero-content{
  max-width:600px;
}

.hero h1{
  font-size:48px;
  margin-bottom:20px;
}

.search{
  display:flex;
  background:#fff;
  border-radius:40px;
  overflow:hidden;
}

.search input{
  flex:1;
  padding:15px;
  border:none;
  outline:none;
}

.search button{
  padding:15px 25px;
  border:none;
  background:#4da3ff;
  color:#fff;
  cursor:pointer;
}

/* MOVIES */
.section{
  padding:60px 80px;
}

.section h2{
  margin-bottom:30px;
}

.movies{
  display:flex;
  gap:20px;
}

.card{
  background:#0e1c33;
  border-radius:15px;
  overflow:hidden;
  width:200px;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card h4{
  padding:10px;
}

.card button{
  margin:10px;
  width:calc(100% - 20px);
  padding:10px;
  border:none;
  border-radius:8px;
  background:#ff7a18;
  color:#fff;
  cursor:pointer;
}

/* LOGIN */
.login{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:url("https://images.unsplash.com/photo-1505685296765-3a2736de412f?q=80&w=1600") center/cover no-repeat;
}

.login-box{
  background:rgba(0,0,0,.6);
  padding:40px;
  border-radius:15px;
  width:350px;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

.login-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#4da3ff;
  color:#fff;
  margin-top:10px;
  cursor:pointer;
}

/* SEATS */
.seat-container{
  padding:60px;
}

.screen{
  text-align:center;
  margin-bottom:30px;
}

.seats{
  display:grid;
  grid-template-columns:repeat(10,40px);
  gap:10px;
  justify-content:center;
}

.seat{
  width:40px;
  height:40px;
  background:#1e3357;
  border-radius:6px;
  cursor:pointer;
}

.seat:hover{
  background:#4da3ff;
}

.summary{
  text-align:center;
  margin-top:30px;
}

.pay{
  padding:12px 30px;
  border:none;
  border-radius:8px;
  background:#4da3ff;
  color:#fff;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">BookBy<span>Shows</span></div>
  <ul>
    <li>Home</li>
    <li>Movies</li>
    <li>Bookings</li>
    <li>Offers</li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>BOOK MOVIES EASILY</h1>
    <div class="search">
      <input type="text" placeholder="Search for Movies...">
      <button>Search</button>
    </div>
  </div>
</section>

<!-- TRENDING -->
<section class="section">
  <h2>Trending Movies</h2>
  <div class="movies">
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba">
      <h4>Crime 101</h4>
      <button>Book Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1502139214982-d0ad755818d8">
      <h4>Tu Jaa Main</h4>
      <button>Book Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4">
      <h4>O Romeo</h4>
      <button>Book Now</button>
    </div>

  </div>
</section>

<!-- LOGIN PAGE -->
<section class="login">
  <div class="login-box">
    <h2>Login</h2>
    <input type="text" placeholder="Email or Phone">
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>
</section>

<!-- SEAT BOOKING -->
<section class="seat-container">
  <div class="screen">SCREEN</div>

  <div class="seats">
    <!-- 60 seats -->
    <script>
      for(let i=0;i<60;i++){
        document.write('<div class="seat"></div>');
      }
    </script>
  </div>

  <div class="summary">
    <h3>Total: ₹750</h3>
    <button class="pay">Proceed to Pay</button>
  </div>
</section>

</body>
</html>
